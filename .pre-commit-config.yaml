# コミット前フック。`pre-commit install` で有効化すること。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # GitHub Actions ワークフローの静的セキュリティ監査
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format
        language: system
        files: \.dart$
        pass_filenames: true

      - id: flutter-analyze
        name: flutter analyze
        # git worktree からのコミット時は GIT_DIR 等がフックに漏洩し、
        # Flutter SDK が自身のバージョンを解決できなくなるため除去する
        entry: bash -c 'unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE; exec flutter analyze' --
        language: system
        pass_filenames: false
        always_run: true
