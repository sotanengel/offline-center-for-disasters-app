# オフライン災害対応アプリ 実装進捗管理ファイル
#
# 運用ルール:
# - status には status_enum の値のみ使用する（機械可読性維持のため）
# - 実装着手時に in_progress、PR マージ時に done + pr 番号を記録する
# - 新たな実装項目が判明したら、実装前にこのファイルへ追加する
meta:
  spec_source: オフライン災害対応アプリ_要件定義書.md
  spec_version: "2026-07-31"
  last_updated: "2026-08-01"

status_enum: [pending, in_progress, done, blocked, out_of_scope]

# 実際に切ったブランチ / PR 単位の進捗
# PR-1〜PR-6 は main へマージ済み（GitHub 上の PR 番号を pr フィールドに記録）。
prs:
  - id: PR-1
    title: プロジェクト基盤とiPhoneテスト環境を整備
    status: done
    pr: 1
  - id: PR-2
    title: データパック生成パイプライン（4県実データ→SQLiteパック）
    status: done
    pr: 2
  - id: PR-3
    title: §4 決定表・高さ判定・水平/垂直避難判定
    status: done
    pr: 3
  - id: PR-4
    title: 1対多 Dijkstra 経路探索・コスト式・ターンバイターン
    status: done
    pr: 4
  - id: PR-5
    title: データ層（パックアクセス・ShelterFinder・HazardGrid・ローダ）
    status: done
    pr: 5
  - id: PR-6
    title: S-01 ホーム画面（ハザードプライア・揺れ検知・タイル・一言入力）
    status: done
    pr: 7
  - id: PR-12
    title: >-
      アプリシェル・実データパック配線・現在地Provider・
      決定論コア不備修正（RouteSearchResult / ShelterSearchResult.notFound /
      GraphLoader bbox / Result コンビネータ）+ Wave1/2 のためのシーム定義
    status: in_progress
    pr: null
    features_covered: [F-03, F-04, F-05, F-06, F-08, F-09, F-10, F-11]

# 要件定義書 §19 の実装フェーズ
phases:
  - id: P0
    title: "データパイプライン（tools/）: OSM→道路グラフ、避難所DB、ハザードグリッド、エッジ属性事前計算"
    spec_ref: "§19"
    status: done
    pr: 2
  - id: P1
    title: "決定論コア: DestinationPolicy + ShelterFinder + RouteEngine + ターンバイターン"
    spec_ref: "§19"
    status: done
    pr: [3, 4, 5]
  - id: P2
    title: ハザードプライア（§3.4-a）+ 揺れ検知 + ホーム画面
    spec_ref: "§19"
    status: done
    pr: 7
  - id: P3
    title: ガイドKB + BM25 + カードUI + 縮退動作（§3.6）
    spec_ref: "§19"
    status: pending
  - id: P4
    title: ルールベース SituationAnalyzer
    spec_ref: "§19"
    status: pending
  - id: P5
    title: LEAP SDK 統合・ティア判定・モデルDL・AI-1/AI-2
    spec_ref: "§19"
    status: out_of_scope # 今回のスコープ外（AI 統合フェーズ）
  - id: P6
    title: AI-3 リランキング・AI-4 生成 + ハルシネーションガード
    spec_ref: "§19"
    status: out_of_scope # 今回のスコープ外（AI 統合フェーズ）
  - id: P7
    title: アクセシビリティ・省電力・実機性能チューニング
    spec_ref: "§19"
    status: out_of_scope # 今回のスコープ外（P1〜P4 完成後）

# 要件定義書 §10 の機能要件
features:
  - id: F-01
    title: "災害種別選択（必須入力）: 8タイル、ハザードプライア並び替え、揺れ検知強調"
    spec_ref: "§3.2, §3.4"
    phase: P2
    status: done
    pr: 7
  - id: F-02
    title: 自由文 / 音声入力（任意、オフラインSTTのみ）
    spec_ref: "§3.2, §8"
    phase: P4
    status: pending
    pr: null
  - id: F-03
    title: 判定サマリと訂正（常時サマリバー、1タップ訂正）
    spec_ref: "§3.7"
    phase: P1
    status: pending
    pr: null
  - id: F-04
    title: 避難先決定（災害種別ごとの決定表による絞り込み）
    spec_ref: "§4.1, §4.2"
    phase: P1
    status: done
    pr: 3
  - id: F-05
    title: 水平/垂直避難の判定
    spec_ref: "§4.3"
    phase: P1
    status: done
    pr: 3
  - id: F-06
    title: 経路探索・案内（1対多Dijkstra、ターンバイターン、TTS）
    spec_ref: "§9"
    phase: P1
    status: in_progress
    pr: 4
    notes: "Dijkstra とターンバイターンは #4 で完了。TTS/UI は S-03 (#9) で実装予定。"
  - id: F-07
    title: 行動ガイド提示（KB検索 → 原文表示）
    spec_ref: "§11"
    phase: P3
    status: pending
    pr: null
  - id: F-08
    title: 縮退動作（種別不明 / GPS不可 / データ未取得 / AI不可）
    spec_ref: "§3.6, §12"
    phase: P3
    status: pending
    pr: null
  - id: F-09
    title: オフライン地図（MBTiles / 超軽量モード自前描画）
    spec_ref: "§13"
    phase: P1
    status: pending
    pr: null
  - id: F-10
    title: データパック管理（地域単位DL、モデルDL）
    spec_ref: "§14"
    phase: P1
    status: in_progress
    pr: 5
    notes: "パックローダ / ShelterFinder / GraphLoader は #5 で完了。DL / 管理 UI は S-05 (#12) で追加。"
  - id: F-11
    title: 初回セットアップ（免責同意、地域パック取得、権限要求）
    spec_ref: "§15"
    phase: P1
    status: pending
    pr: null

