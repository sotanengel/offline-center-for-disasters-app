    title: 経路探索・案内（1対多Dijkstra、ターンバイターン、TTS）
    spec_ref: "§9"
    phase: P1
    status: done
    pr: [4, 19]
  - id: F-07
    title: 行動ガイド提示（KB検索 → 原文表示）
    spec_ref: "§11"
    phase: P3
    status: done
    pr: 17
  - id: F-08
    title: 縮退動作（種別不明 / GPS不可 / データ未取得 / AI不可）
    spec_ref: "§3.6, §12"
    phase: P3
    status: done
    pr: [17, 19]
  - id: F-09
    title: オフライン地図（MBTiles / 超軽量モード自前描画）
    spec_ref: "§13"
    phase: P1
    status: done
    pr: 19
    notes: >-
      PR-18 で S-03 道路グラフ Polyline 背景描画を追加（超軽量モード本体）。
      MBTiles は Q3 未決。
  - id: F-10
    title: データパック管理（地域単位DL、モデルDL）
    spec_ref: "§14"
    phase: P1
    status: done
    pr: [5, 18]
    notes: >-
      実機配置は tool/device/install_pack.sh（devicectl）。
      PR-17 で導入済みパックのディスク列挙と県境マルチパック同時利用を追加。
  - id: F-11
    title: 初回セットアップ（免責同意、地域パック取得、権限要求）
    spec_ref: "§15"
    phase: P1
    status: done
    pr: [18]
    notes: >-
      PR-17 で初回セットアップ起動と位置情報 requestPermission を接続。
  - id: F-10-bundled-merge
    title: 同梱用統合パック（bundled）— 県別生成を merge して初回インストール
    spec_ref: "§12 / §14"
    phase: P1
    status: done
    pr: 32
    notes: >-
      packgen.merge_pack で config.REGIONS 全県を 1 sqlite に統合。
      ランタイムは packs/bundled/pack.sqlite のみ（県境 selectActiveRegions 廃止）。
  - id: F-UI-01
    title: ホームUI簡素化（揺れバナー・自由記述・緊急導線・unknownタイル・TTSトグル削除）
    spec_ref: "§3.2"
    phase: P2
    status: in_progress
    notes: >-
      LLM 基盤（data/llm, providers, 設定画面）は維持。UI からの入口のみ削除。
  - id: F-BUG-01
    title: 起動時の赤表示バグ修正（直近選択クリア・タイル強調除去）
    spec_ref: "§3.2, §3.4"
    phase: P2
    status: in_progress
    notes: >-
      コールド起動時に RecentSelectionStore を clear。ハザードプライアは並び替えのみ。
      揺れ検知 UI・センサ起動を無効化。

