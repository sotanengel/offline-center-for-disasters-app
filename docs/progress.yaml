# 要件定義書 §22 の未決事項の扱い
open_questions:
  - id: Q1
    item: ガイドKBの監修体制
    note: 未決のままリリースしない。現段階は公的機関の公開情報の引用で構成し、リリース前に人間の監修が必要
  - id: Q3
    item: 地図タイルの事前キャッシュ可否
    note: 超軽量モード（道路グラフ自前描画）を先に実装。MBTiles は地理院タイル規約確認後に任意DLとして追加
  - id: Q4
    item: ハザードグリッド解像度
    note: 約50mメッシュで実装し、精度検証は実データ生成後に行う
  - id: Q5
    item: 建物階数データの入手可否
    note: 初版は利用者申告のみ（§4.3 の階数不明時は断定しない挙動に依存）
  - id: Q6
    item: 対応地域の初期スコープ
    note: 東京・千葉・埼玉・神奈川の4県（ユーザー決定 2026-08-01）
  - id: Q9
    item: 災害種別ごとの猶予時間（津波到達想定時間・大雨氾濫までの余裕等）の根拠
    note: >-
      HazardContext.graceTime の充填データ源が未決。現状は null 固定で
      EvacuationModeJudge の travelExceeded は常に false（テストで固定）。
      要件定義書 §22 Q9 として追記済み。決定次第 HazardGridRepository と
      tools/packgen/hazard.py の両方に列を追加する。
