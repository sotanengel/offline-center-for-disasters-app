# オフライン災害対応アプリ 実装進捗管理ファイル
#
# 運用ルール:
# - status には status_enum の値のみ使用する（機械可読性維持のため）
# - 実装着手時に in_progress、PR マージ時に done + pr 番号を記録する
# - 新たな実装項目が判明したら、実装前にこのファイルへ追加する
meta:
  spec_source: オフライン災害対応アプリ_要件定義書.md
  spec_version: "2026-07-31"
  last_updated: "2026-08-02"
  branch: main

status_enum: [pending, in_progress, done, blocked, out_of_scope]

# 実際に切ったブランチ / PR 単位の進捗
prs:
  - id: PR-1
    title: プロジェクト基盤とiPhoneテスト環境を整備
    status: done
    pr: 1
  - id: PR-2
    title: データパック生成パイプライン（4県実データ→SQLiteパック）
    status: done
    pr: 2
  - id: PR-3
    title: §4 決定表・高さ判定・水平/垂直避難判定
    status: done
    pr: 3
  - id: PR-4
    title: 1対多 Dijkstra 経路探索・コスト式・ターンバイターン
    status: done
    pr: 4
  - id: PR-5
    title: データ層（パックアクセス・ShelterFinder・HazardGrid・ローダ）
    status: done
    pr: 5
  - id: PR-6
    title: S-01 ホーム画面（ハザードプライア・揺れ検知・タイル・一言入力）
    status: done
    pr: 7
  - id: PR-12
    title: >-
      アプリシェル・実データパック配線・現在地Provider・
      決定論コア不備修正 + Wave1/2 のためのシーム定義
    status: done
    pr: 15
    features_covered: [F-03, F-04, F-05, F-06, F-08, F-09, F-10, F-11]
  - id: PR-8
    title: P0 ハザード GML 修正・4県再生成（Issue #8）
    status: done
    pr: 20
  - id: PR-9
    title: ルールベース SituationAnalyzer + ゴールデン100件
    status: done
    pr: 16
  - id: PR-8-guide
    title: ガイド KB 80件 + BM25 + S-04 + §3.6 縮退
    status: done
    pr: 17
  - id: PR-10
    title: S-05 設定 + S-06 初回セットアップ + LLM 抽象化
    status: done
    pr: 18
  - id: PR-7
    title: S-02 結果サマリ + S-03 経路案内
    status: done
    pr: 19
  - id: PR-11
    title: 統合テスト・オフライン CI・アクセシビリティ・最終 progress.yaml
    status: done
    pr: 21
  - id: PR-14
    title: LEAP SDK 統合・シミュレータ安定化・実避難先表示・座標統一
    status: done
    pr: 22
    features_covered: [F-02, F-03, F-04]
  - id: PR-15
    title: LFM2.5 実推論 integration/unit テスト（real_llm タグ）
    status: done
    pr: 23
    features_covered: [F-02]
  - id: PR-16
    title: 経路グラフの bbox 絞り込み（実機 S-02 完了不能の解消）・実機テスト脚本の安定化
    status: in_progress
    features_covered: [F-04, F-10]
    note: >-
      実機検証で判明した 2 件の修正。
      (1) routeEngineProvider が経路グラフを全件ロードしており（東京パックで
      ノード 3,303,508・エッジ 3,825,787 件）、実機では S-02 が 10 分以上
      完了しなかった。GraphLoader.load(bounds:) は既に bbox 対応済みだったため
      現在地半径 12km（§4.4 の 10km 拡大を包含）に絞る。
      シミュレータでは通り実機のみ再現するため、シミュレータ検証では検出できない。
      (2) flutter test -d <device> は実行後にアプリをアンインストールし、
      デベロッパプロファイルごと消えて毎回「未信頼」に戻っていた。
      テスト後に必ず入れ直す trap を追加して信頼を維持する。
      あわせて実機 integration に壁時計上限と起動停滞検知を追加し、
      ハングではなく失敗として打ち切るようにした。
  - id: PR-17
    title: 県境マルチパック同時利用と位置情報権限ダイアログ（F-10 / F-11）
    status: done
    pr: 25
    features_covered: [F-10, F-11]
    note: >-
      currentRegionProvider が tokyo 固定で県境では片県しか使えなかった。
      導入済みパックをディスク列挙し、現在地の探索半径と bbox が重なる
      複数県を同時利用する。あわせて locationProvider が requestPermission
      を呼ばず、初回セットアップも起動されていなかったため権限ダイアログが
      出ない問題を修正する。
  - id: PR-18
    title: F-09 S-03 経路案内に道路グラフ Polyline 描画を追加
    status: done
    pr: 28
    features_covered: [F-09]
    note: >-
      NavScreen が経路 polyline のみ描画し道路網が表示されなかった。
      §13 超軽量モードとして pack.loadGraph(bounds:) で bbox 絞り込み読込し
      薄グレー PolylineLayer を背景に重ねる。      MBTiles は Q3 未決のまま。

  - id: PR-19
    title: アプリ同梱データパック（東京）初回展開
    status: done
    pr: 28
    features_covered: [F-10]
    note: >-
      リリースビルドに tokyo pack.sqlite を assets 同梱し、初回起動時に
      Application Support へ展開。tool/build/release_ios.sh でビルド。

  - id: PR-20
    title: 探索半径10/20km・S-02プログレスバー・S-03現在地追従（F-04/F-06）
    status: in_progress
    features_covered: [F-04, F-06]
    note: >-
      ユーザー要望: 3km 初期半径は狭すぎるため 10km/20km に変更（§17 Q10 記録）。
      探索中 UI フリーズ感の解消のため段階付き LinearProgressIndicator。
      NavScreen が NavArgs.origin 固定で案内中の GPS 更新を反映していなかった問題を修正。

