[project]
name = "packgen"
version = "0.1.0"
description = "オフライン災害対応アプリ 地域データパック生成パイプライン"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "Pillow>=10.0",
    "osmium>=4.0",
    "requests>=2.32",
    "shapely>=2.0",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packgen", "kbgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
